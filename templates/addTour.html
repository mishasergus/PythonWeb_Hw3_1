{% extends "base.html" %}

{% block title %}Додати тур - Туристична агенція{% endblock %}

{% block content %}
    <div class="tours-container">
        <h1>Додати новий тур</h1>

        <form method="POST" action="{{ url_for('addTour') }}" class="filter-form">
            <div class="form-group">
                <label for="name">Назва туру:</label>
                <input type="text" id="name" name="name" placeholder="Введіть назву туру..." required>
            </div>

            <div class="form-group">
                <label for="destination">Напрямок (країна/місто):</label>
                <input type="text" id="destination" name="destination" placeholder="Наприклад: Україна, Карпати" required>
            </div>

            <div class="form-group">
                <label for="description">Опис:</label>
                <textarea id="description" name="description" placeholder="Короткий опис туру..." rows="3"></textarea>
            </div>

            <div class="form-group">
                <label for="price">Ціна ($):</label>
                <input type="number" id="price" name="price" placeholder="350.0" step="0.01" required>
            </div>

            <div class="form-group">
                <label for="duration">Тривалість (днів):</label>
                <input type="number" id="duration" name="duration" placeholder="4" required>
            </div>

            <div class="form-group">
                <label for="image_url">Посилання на зображення (URL):</label>
                <input type="url" id="image_url" name="image_url" placeholder="https://example.com/image.jpg">
            </div>

            <button type="submit" class="btn-filter">Зберегти тур</button>
        </form>
    </div>
{% endblock %}
