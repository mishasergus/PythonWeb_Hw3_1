<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мій сайт{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo">
                <a href="{{ url_for('index') }}">🌍 ТуристАгенція</a>
            </div>
            <button class="burger" id="burgerBtn" aria-label="Відкрити меню">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="main-nav" id="mainNav">
                <ul>
                    <li><a href="{{ url_for('index') }}" class="{% if active_page == 'index' %}active{% endif %}">Головна</a></li>
                    <li><a href="{{ url_for('about') }}" class="{% if active_page == 'about' %}active{% endif %}">Про нас</a></li>
                    <li><a href="{{ url_for('tours') }}" class="{% if active_page == 'tours' %}active{% endif %}">Тури</a></li>
                    <li><a href="{{ url_for('addTour') }}" class="{% if active_page == 'add_tour' %}active{% endif %}">Додати тур</a></li>
                    <li><a href="{{ url_for('contacts') }}" class="{% if active_page == 'contacts' %}active{% endif %}">Контакти</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Туристична агенція. Усі права захищені.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
